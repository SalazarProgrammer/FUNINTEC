<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Formulario</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="form-container">
			<h2>Formulario de Registro</h2>
			<form id="userForm">
				<div class="form-group">
					<label for="cedula">Cédula de Identidad:</label>
					<input
						type="number"
						id="cedula"
						name="cedula"
						required
						placeholder="Ingrese su número de cédula" />
				</div>

				<div class="form-group">
					<label for="nombres">Nombres:</label>
					<input
						type="text"
						id="nombres"
						name="nombres"
						required
						placeholder="Ingrese sus nombres" />
				</div>

				<div class="form-group">
					<label for="apellidos">Apellidos:</label>
					<input
						type="text"
						id="apellidos"
						name="apellidos"
						required
						placeholder="Ingrese sus apellidos" />
				</div>

				<div class="form-group">
					<label for="email">Correo Electrónico:</label>
					<input
						type="email"
						id="email"
						name="email"
						required
						placeholder="ejemplo@correo.com" />
				</div>

				<div class="form-group">
					<label for="nacionalidad">Nacionalidad:</label>
					<select id="nacionalidad" name="nacionalidad" required>
						<option value="">Seleccione su nacionalidad</option>
						<option value="Venezolana">Venezolana</option>
						<option value="Marciana">Marciana</option>
						<option value="Colombiana">Colombiana</option>
						<option value="Argentina">Argentina</option>
						<option value="Chilena">Chilena</option>
						<option value="Peruana">Peruana</option>
						<option value="Mexicana">Mexicana</option>
						<option value="Española">Española</option>
						<option value="Otra">Otra</option>
					</select>
				</div>

				<button type="submit">Enviar</button>
			</form>
			<div class="form-footer">Todos los derechos reservados © 2025</div>
		</div>
		<!-- Ventana emergente para mostrar los datos -->
		<div class="modal-overlay" id="modalOverlay">
			<div class="modal">
				<div class="modal-header">
					<h3 class="modal-title">Datos del Formulario</h3>
					<button class="close-btn" id="closeModal">&times;</button>
				</div>
				<div class="modal-body" id="modalBody">
					<!-- Los datos se insertarán aquí -->
				</div>
			</div>
		</div>

		<!-- Funcionalidad JavaScript -->
		<script src="formTS.js"></script>
	</body>
</html>
